name: Rebuild the daily read

# Regenerates docs/index.html from live sources and commits it.
# GitHub Pages serves docs/ on the default branch.

on:
  schedule:
    - cron: '0 6 * * *'    # 07:00 Irish time in winter, 08:00 in summer
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-daily
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run build
        env:
          COLLECTOR_USER_AGENT: ${{ vars.COLLECTOR_USER_AGENT }}
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Rebuild $(date -u +%Y-%m-%d\ %H:%M) UTC"
          git push
